<!-- Container where the text will appear -->
<div id="neo-terminal" style="font-family: "Fira Code"; font-size: 16; color: #00ff00; background: #000; padding: 2px; border: 0 solid #00ff00; width: fit-content;"></div>

<script>
const words = ["INITIALIZING NEOCITY PROTOCOL...", "BYPASSING FIREWALL...", "ACCESS GRANTED. WELCOME CITIZEN."];
let i = 0, timer;

function typingEffect() {
    let word = words[i].split("");
    var loopTyping = function() {
        if (word.length > 0) {
            document.getElementById('neo-terminal').innerHTML += word.shift();
        } else {
            setTimeout(deletingEffect, 2000);
            return false;
        }
        timer = setTimeout(loopTyping, 100);
    };
    loopTyping();
}

function deletingEffect() {
    let word = words[i].split("");
    var loopDeleting = function() {
        if (word.length > 0) {
            word.pop();
            document.getElementById('neo-terminal').innerHTML = word.join("");
        } else {
            if (words.length > (i + 1)) { i++; } else { i = 0; }
            setTimeout(typingEffect, 500);
            return false;
        }
        timer = setTimeout(loopDeleting, 50);
    };
    loopDeleting();
}
typingEffect();
</script>
